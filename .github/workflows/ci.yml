name: CI & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.0.4", "4.2.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot (${{ matrix.godot }})
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ matrix.godot }}
          include-templates: false
          use-dotnet: false

      - name: Run CI analysis
        run: |
          godot --headless --version
          cp complexity_config.ci.json complexity_config.json
          # Uses complexity_config.ci.json (fixtures) with high fail thresholds for dogfood.
          godot --headless --script cli/analyze_project.gd -- \
            --project-path . \
            --output ci_report.json \
            --csv-output ci_report.csv

      - name: Verify fixtures
        run: godot --headless --script tests/verify_cc_cog.gd

      - name: Edge cases
        run: godot --headless --script tests/test_edge_cases.gd

      - name: Threshold gate
        run: godot --headless --script tests/test_threshold_gate.gd

      - name: Validate confidence gate
        run: godot --headless --script tests/validate_confidence.gd -- \
          --min-r2 0.70 \
          --metrics-out ci_metrics.json

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-godot-${{ matrix.godot }}
          path: |
            ci_report.json
            ci_report.csv
            ci_metrics.json

  release:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release
        run: |
          mkdir -p dist
          zip -r dist/gdmetrics-${{ github.ref_name }}.zip \
            addons/gdscript_complexity \
            cli \
            examples \
            docs \
            README.md \
            LICENSE \
            complexity_config.example.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gdmetrics-${{ github.ref_name }}.zip
          body_path: release/NOTES.md
          fail_on_unmatched_files: false
